[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-tools"
version = "0.1.0"
description = "Exact hand scoring and integer deckbuilding experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "tqdm>=4.70.1",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mtg_tools*"]
namespaces = false
