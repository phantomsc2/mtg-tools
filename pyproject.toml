requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "leitwerk>=0.9,<0.10",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
leitwerk = { path = "../leitwerk", editable = true }

[tool.ruff]
line-length = 120
